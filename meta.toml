[project]
name = "meta"
author = {name = "Polshkrev"}
description = "A golang build tool."

[project.version]
minor = 1

[license]
type = "MIT"
path = "LICENSE"

[paths]
readme = "README.md"

[urls]
repository = "https://github.com/Polshkrev/meta"

[commands]
script = ["build/build"]
run = ["bin/test.exe"]
build = ["go", "build", "-o", "bin/meta.exe", "cmd/meta.go"]
tidy = ["go", "mod", "tidy"]